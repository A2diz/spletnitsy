name: Claude AI Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─── Авто-ревью каждого нового PR ───────────────────────────────────────────
  claude-review:
    name: Claude — ревью PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ревью через Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  # ─── Реакция на @claude в комментариях к PR и issue ─────────────────────────
  claude-on-mention:
    name: Claude — по команде @claude
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude')
    steps:
      - uses: actions/checkout@v4

      - name: Выполнить задачу от Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
